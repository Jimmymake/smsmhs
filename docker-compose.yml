services:
  mongo:
    image: mongo:7
    container_name: semasms-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - semasms-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: semasms-backend
    restart: unless-stopped
    ports:
      - "3010:3001"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb://mongo:27017/semasms_db
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - semasms-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  semasms-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
